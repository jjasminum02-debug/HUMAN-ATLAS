<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>T74 local source geometry QA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;color:#e8edf2;font:14px/1.45 system-ui,sans-serif}body{display:grid;grid-template-columns:280px minmax(0,1fr)}aside{overflow:auto;border-right:1px solid #394651;padding:14px}main{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}h1{font-size:17px;margin:0 0 8px}.note{color:#bac7d0;font-size:12px}#list{display:grid;gap:4px;margin-top:12px}button{color:inherit;background:#202a34;border:1px solid #536372;border-radius:4px;padding:8px 10px;min-height:40px;cursor:pointer}button[aria-pressed=true]{outline:2px solid #84c5ff}button:focus-visible{outline:3px solid #ffd76a;outline-offset:2px}#list button{text-align:left;font-size:12px}.selected{padding:10px;border:1px solid #536372;min-height:70px;margin-top:12px;white-space:pre-wrap}#toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px;border-bottom:1px solid #394651}#stage{position:relative;min-height:0;min-width:0}canvas{display:block;width:100%;height:100%;outline:none}#status{padding:8px 12px;border-top:1px solid #394651;color:#bdc9d0}
@media(max-width:700px){body{grid-template-columns:1fr;grid-template-rows:38vh 62vh}aside{border:0;border-bottom:1px solid #394651;padding:8px;overflow:auto}h1{font-size:15px}#list{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:6px}.selected{margin-top:6px;min-height:50px}main{min-height:0}#toolbar{padding:6px;gap:5px}button{min-height:36px;padding:6px 8px}}
</style>
</head>
<body>
<aside><h1>내부 정적 자산 검증</h1><p class="note">T74 · BodyParts3D R4 · 제품 학습 화면 아님 · source-only / rights hold / 사람 검토 대기</p><p class="note">T52 마루뼈 재사용, T72 이마뼈·아래턱뼈·뒤통수뼈 문맥, T74 신규 표면을 하나의 AnatomySceneRoot와 renderer에 표시합니다.</p><div id="selected" class="selected" aria-live="polite">구조 선택 없음</div><div id="list" aria-label="T74 source target selection"></div><p class="note">↑/↓ 선택 · 1 정면 · 2 후면 · 3 측면 · Esc 전체 보기</p></aside>
<main><div id="toolbar" role="toolbar" aria-label="정적 QA 카메라"><button data-view="front" aria-pressed="true">정면 (+Z)</button><button data-view="back" aria-pressed="false">후면 (-Z)</button><button data-view="side" aria-pressed="false">측면 (+X)</button><button id="fit">전체 보기</button></div><div id="stage"><canvas id="canvas" tabindex="0" aria-label="T74 same-frame source geometry preview"></canvas></div><div id="status" role="status">정적 자산을 불러오는 중</div></main>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js"}}</script>
<script type="module" src="./private-preview.mjs"></script>
</body></html>
