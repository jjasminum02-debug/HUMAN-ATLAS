<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUMAN ATLAS — T02 종아리 3D 자산 시험</title>
<style>
:root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172c3a; background:#f4f8fa; }
* { box-sizing:border-box; }
body { margin:0; padding:18px; }
header { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin:0 auto 12px; max-width:1440px; }
h1 { font-size:20px; margin:0 0 4px; letter-spacing:.02em; }
.sub { color:#627681; font-size:12px; }
.actions { display:flex; flex-wrap:wrap; gap:8px; }
button { border:1px solid #bed0d9; background:#fff; color:#1b3a48; padding:8px 11px; border-radius:7px; font-weight:600; cursor:pointer; }
button:hover { background:#eaf3f6; }
main { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:14px; max-width:1440px; margin:auto; }
.stage { border:1px solid #d4e0e5; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 6px 24px #294a5d12; }
canvas { display:block; width:100%; height:min(72vh,760px); min-height:500px; touch-action:none; cursor:grab; }
canvas:active { cursor:grabbing; }
#status { border-top:1px solid #e1eaee; padding:9px 12px; color:#4a6674; font-size:12px; }
aside { border:1px solid #d4e0e5; background:#fff; border-radius:12px; padding:14px; box-shadow:0 6px 24px #294a5d12; max-height:calc(min(72vh,760px) + 44px); overflow:auto; }
aside h2 { font-size:14px; margin:0 0 7px; }
aside p { color:#607680; font-size:11px; line-height:1.5; margin:0 0 12px; }
.group { border-top:1px solid #e5edf0; padding:10px 0; }
label { display:flex; align-items:flex-start; gap:8px; font-size:12px; padding:5px 0; }
label small { color:#78909a; display:block; font-size:10px; margin-top:2px; }
.swatch { width:11px; height:11px; border-radius:3px; margin-top:2px; flex:0 0 11px; }
.warning { margin-top:12px; background:#fff8e8; color:#705523; border:1px solid #ecd59c; border-radius:8px; padding:10px; font-size:10px; line-height:1.45; }
@media(max-width:900px) { main {grid-template-columns:1fr} aside {max-height:none} canvas {height:60vh;min-height:400px} header {align-items:flex-start;flex-direction:column} }
</style>
</head>
<body>
<header>
  <div><h1>HUMAN ATLAS · T02 종아리 메시 시험</h1><div class="sub">BodyParts3D Release 4.0 · IS-A tree · 우측 종아리 참조 기하 · 학습 앱이 아닌 한시적 뷰어 시험</div></div>
  <div class="actions">
    <button id="posterior">후방 샘플</button><button id="all">pilot 전체</button><button id="front">정면 보기</button><button id="reset">초기화</button><button id="save">PNG 증거 저장</button>
  </div>
</header>
<main>
  <section class="stage">
    <canvas id="view" aria-label="우측 종아리 근육과 뼈의 3D 메시"></canvas>
    <div id="status" role="status">메시를 읽는 중…</div>
  </section>
  <aside>
    <h2>표시 레이어</h2>
    <p>체크 항목은 원본 FJ 파일에 연결됩니다. 회전은 드래그, 확대/축소는 휠을 사용합니다.</p>
    <div class="group"><strong>근육 메시</strong><div id="muscles"></div></div>
    <div class="group"><strong>뼈 메시</strong><div id="bones"></div></div>
    <div class="warning">형상 보기만을 위한 시험입니다. 색·겹침은 화면 표시이며 기시·정지나 부착면의 검증 결과가 아닙니다. 본문 메시의 license 주석과 아카이브 현재 허용 문구 차이는 manifest에 기록되어 있습니다.</div>
  </aside>
</main>
<script>
const definitions = [
 {id:'FJ1397',group:'muscle',label:'Gastrocnemius · medial head',fma:'FMA45957',bp:'BP5539',color:'#e1a53b'},
 {id:'FJ1394',group:'muscle',label:'Gastrocnemius · lateral head',fma:'FMA45960',bp:'BP5541',color:'#d28a2c'},
 {id:'FJ1437',group:'muscle',label:'Soleus',fma:'FMA22558',bp:'BP4999',color:'#15a792'},
 {id:'FJ1439',group:'muscle',label:'Tibialis anterior',fma:'FMA22544',bp:'BP5018',color:'#4c8dcc'},
 {id:'FJ1440',group:'muscle',label:'Tibialis posterior',fma:'FMA65018',bp:'BP5004',color:'#8b79c5'},
 {id:'FJ1410',group:'muscle',label:'Fibularis longus',fma:'FMA22552',bp:'BP5013',color:'#cd6d7c'},
 {id:'FJ1409',group:'muscle',label:'Fibularis brevis',fma:'FMA22554',bp:'BP5015',color:'#df8d9a'},
 {id:'FJ3387',group:'bone',label:'Right tibia',fma:'FMA24477',bp:'BP8031',color:'#8095a1'},
 {id:'FJ3366',group:'bone',label:'Right fibula',fma:'FMA24480',bp:'BP8009',color:'#9aabb4'},
 {id:'FJ3385',group:'bone',label:'Right talus',fma:'FMA24482',bp:'BP8033',color:'#bac5ca'},
 {id:'FJ3360',group:'bone',label:'Right calcaneus',fma:'FMA24497',bp:'BP9040',color:'#c5ced2'}
];
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');
const loaded=[]; let az=0,el=0.08,zoom=1,drag=null,sceneCenter=[-.06,.18,0],baseScale=1;
const state={loaded:0,total:definitions.length,vertices:0,faces:0,errors:[]};
window.addEventListener('error',e=>state.errors.push(`window.error: ${e.message}`));
window.addEventListener('unhandledrejection',e=>state.errors.push(`unhandledrejection: ${e.reason}`));
function parseOBJ(text,d){
 const raw=[],faces=[];
 for(const line of text.split(/\r?\n/)){
  if(line.startsWith('v ')){const p=line.trim().split(/\s+/);raw.push([+p[1]/1000,+p[3]/1000,-(+p[2])/1000]);}
  else if(line.startsWith('f ')){const ids=line.trim().split(/\s+/).slice(1).map(t=>{let i=parseInt(t.split('/')[0],10);return i<0?raw.length+i:i-1;});for(let i=1;i<ids.length-1;i++)faces.push([ids[0],ids[i],ids[i+1]]);}
 }
 return {...d,vertices:raw,faces,alpha:d.group==='bone'?0.38:0.98};
}
function mkControls(){
 for(const d of definitions){const row=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.dataset.id=d.id;cb.checked=['FJ1437','FJ3387','FJ3366','FJ3385','FJ3360'].includes(d.id);cb.addEventListener('change',draw);const sw=document.createElement('i');sw.className='swatch';sw.style.background=d.color;const copy=document.createElement('span');copy.innerHTML=`${d.label}<small>${d.fma} · ${d.bp} · ${d.id}</small>`;row.append(cb,sw,copy);document.getElementById(d.group==='muscle'?'muscles':'bones').append(row);}
}
function selected(){const ids=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.dataset.id);return loaded.filter(x=>ids.includes(x.id));}
function cameraBasis(){const ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el);return {dir:[sa*ce,se,ca*ce],right:[ca,0,-sa],up:[-sa*se,ce,-ca*se]};}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function project(p,basis,w,h,radius,scale){const q=sub(p,sceneCenter),depth=dot(q,basis.dir),dist=radius-depth;const s=scale*radius/dist*zoom;return [w/2+dot(q,basis.right)*s,h/2-dot(q,basis.up)*s,depth];}
function resize(){const r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function draw(){
 const rect=canvas.getBoundingClientRect(),w=rect.width,h=rect.height;if(!w||!h)return;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fbfdfe';ctx.fillRect(0,0,w,h);
 const list=selected(),basis=cameraBasis();
 const allPoints=list.flatMap(a=>a.vertices);if(!allPoints.length){ctx.fillStyle='#637b88';ctx.font='16px sans-serif';ctx.fillText('표시할 메시를 선택하세요.',28,42);return;}
 let min=[0,Infinity,Infinity],max=[0,-Infinity,-Infinity];for(const p of allPoints)for(let i=0;i<3;i++){min[i]=Math.min(min[i],p[i]);max[i]=Math.max(max[i],p[i]);}
 sceneCenter=[(min[0]+max[0])/2,(min[1]+max[1])/2,(min[2]+max[2])/2];
 const span=Math.max(max[0]-min[0],max[1]-min[1],max[2]-min[2],.1);const radius=span*2.5;baseScale=Math.min(w/(max[0]-min[0]+.035),h/(max[1]-min[1]+.06))*.77;
 ctx.strokeStyle='#d7e3e8';ctx.lineWidth=1;ctx.setLineDash([3,5]);const top=[0,max[1],0],bottom=[0,min[1],0],pt=project(top,basis,w,h,radius,baseScale),pb=project(bottom,basis,w,h,radius,baseScale);ctx.beginPath();ctx.moveTo(pt[0],pt[1]);ctx.lineTo(pb[0],pb[1]);ctx.stroke();ctx.setLineDash([]);
 const faces=[];for(const a of list)for(const f of a.faces){const p0=a.vertices[f[0]],p1=a.vertices[f[1]],p2=a.vertices[f[2]];const c=[(p0[0]+p1[0]+p2[0])/3,(p0[1]+p1[1]+p2[1])/3,(p0[2]+p1[2]+p2[2])/3];faces.push({a,p0,p1,p2,depth:dot(sub(c,sceneCenter),basis.dir)});}
 faces.sort((a,b)=>a.depth-b.depth);const light=[.25,.72,.64];
 for(const f of faces){const a=project(f.p0,basis,w,h,radius,baseScale),b=project(f.p1,basis,w,h,radius,baseScale),c=project(f.p2,basis,w,h,radius,baseScale);const n=cross(sub(f.p1,f.p0),sub(f.p2,f.p0));const nn=Math.hypot(...n)||1;const shade=.52+.46*Math.abs(dot(n.map(x=>x/nn),light));ctx.globalAlpha=f.a.alpha;ctx.fillStyle=shadeColor(f.a.color,shade);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.closePath();ctx.fill();}
 ctx.globalAlpha=1;
 const orientation=(Math.abs(az)<.04&&Math.abs(el)<.04)?'anterior view':(Math.abs(az)<.16?'anterior oblique':'orbited view');
 ctx.fillStyle='#203d4b';ctx.font='600 15px -apple-system, sans-serif';ctx.fillText(`우측 종아리 · ${orientation}`,18,27);ctx.font='11px -apple-system, sans-serif';ctx.fillStyle='#5d7581';ctx.fillText(`표시 ${list.length} meshes · x<0 = patient right · Y head · Z anterior`,18,46);
 ctx.fillStyle='#d96f59';ctx.font='11px -apple-system, sans-serif';ctx.fillText('midline x = 0',Math.min(w-92,pt[0]+7),Math.max(66,pt[1]+13));
 let ly=68;for(const a of list){ctx.fillStyle=a.color;ctx.fillRect(18,ly-8,10,10);ctx.fillStyle='#405965';ctx.font='11px -apple-system, sans-serif';ctx.fillText(`${a.label} (${a.id})`,34,ly);ly+=17;}
 // fixed coordinate triad: +X is patient-left, +Y is head, +Z is anterior
 const ox=w-96,oy=h-74;ctx.lineWidth=2;ctx.strokeStyle='#d95042';ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+42,oy);ctx.stroke();ctx.fillStyle='#ad382e';ctx.fillText('X left',ox+3,oy-7);ctx.strokeStyle='#3677bd';ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox,oy-42);ctx.stroke();ctx.fillStyle='#2c649b';ctx.fillText('Y head',ox-25,oy-47);ctx.fillStyle='#208c77';ctx.beginPath();ctx.arc(ox-18,oy+14,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#287868';ctx.fillText('Z anterior ⊙',ox-88,oy+35);
 ctx.fillStyle='#687e88';ctx.font='9px -apple-system, sans-serif';ctx.fillText('BodyParts3D · © The Database Center for Life Science · CC BY 4.0 · OBJ comments retain earlier CC BY-SA 2.1 JP notice',18,h-14);
}
function shadeColor(hex,k){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgb(${Math.round(r*k)},${Math.round(g*k)},${Math.round(b*k)})`;}
function choose(ids){for(const cb of document.querySelectorAll('input[type=checkbox]'))cb.checked=ids.includes(cb.dataset.id);draw();}
function reset(){az=0;el=.08;zoom=1;draw();}
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,az,el];canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;az=drag[2]-(e.clientX-drag[0])*.008;el=Math.max(-1.2,Math.min(1.2,drag[3]+(e.clientY-drag[1])*.008));draw();});
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(3.5,zoom*(e.deltaY<0?1.12:.89)));draw();},{passive:false});
document.getElementById('posterior').onclick=()=>choose(['FJ1437','FJ3387','FJ3366','FJ3385','FJ3360']);
document.getElementById('all').onclick=()=>choose(definitions.map(x=>x.id));
document.getElementById('front').onclick=()=>{az=0;el=0;draw();};document.getElementById('reset').onclick=reset;
document.getElementById('save').onclick=async()=>{const b=document.getElementById('save');b.disabled=true;try{const blob=await new Promise(ok=>canvas.toBlob(ok,'image/png'));const res=await fetch('/__capture',{method:'POST',headers:{'Content-Type':'image/png','X-Artifact':'calf-viewer-trial.png'},body:blob});const j=await res.json();document.getElementById('status').textContent=j.saved?`PNG evidence saved · ${j.bytes} bytes · ${j.path}`:`PNG save failed · ${j.error}`;}catch(e){document.getElementById('status').textContent=`PNG save failed · ${e}`;}finally{b.disabled=false;}};
mkControls();window.addEventListener('resize',resize);
(async()=>{for(const d of definitions){try{const r=await fetch(`/atlas-data/assets/bodyparts3d-v4-pilot/${d.id}.obj`);if(!r.ok)throw new Error(`${r.status} ${d.id}`);const a=parseOBJ(await r.text(),d);loaded.push(a);state.loaded++;state.vertices+=a.vertices.length;state.faces+=a.faces.length;}catch(e){state.errors.push(String(e));}}const platform=/Mac/i.test(navigator.platform)?'macOS desktop':navigator.platform;document.getElementById('status').textContent=`Loaded ${state.loaded}/${state.total} OBJ · ${state.vertices.toLocaleString()} vertices · ${state.faces.toLocaleString()} faces · runtime/load errors ${state.errors.length} · mm→m; atlas [x,y,z]=source [x,z,-y]/1000 · Reference: ${platform}, viewport ${innerWidth}×${innerHeight} CSS px, DPR ${devicePixelRatio}`;draw();})();
resize();
</script>
</body>
</html>
