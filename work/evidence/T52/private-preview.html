<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>T52 source package QA</title>
  <script type="importmap">
    {"imports":{"three":"/atlas-web/node_modules/three/build/three.module.js"}}
  </script>
  <style>
    :root { color-scheme: light; font: 15px/1.45 system-ui, -apple-system, sans-serif; color: #172334; background: #eef2f6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 18px; background: #fff; border-bottom: 1px solid #d8e0e9; }
    h1 { margin: 0; font-size: 18px; }
    .scope { color: #566477; font-size: 13px; }
    main { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 12px; padding: 12px; height: calc(100vh - 58px); min-height: 520px; }
    aside { background: #fff; border: 1px solid #d6dee8; border-radius: 10px; padding: 12px; min-height: 0; display: flex; flex-direction: column; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    button, input { font: inherit; }
    button { border: 1px solid #c4cfdd; border-radius: 7px; background: #f7f9fc; color: #1f3149; padding: 7px 10px; cursor: pointer; }
    button:hover, button[aria-pressed="true"] { border-color: #3e6f9f; background: #e5eff8; }
    button:focus-visible, input:focus-visible { outline: 3px solid #76a7d4; outline-offset: 2px; }
    input { width: 100%; padding: 8px; border: 1px solid #c4cfdd; border-radius: 7px; }
    #asset-list { flex: 1 1 0; overflow: auto; min-height: 100px; margin-top: 8px; }
    .asset { display: block; width: 100%; text-align: left; margin: 3px 0; overflow-wrap: anywhere; }
    .asset small { display: block; color: #657589; font-size: 11px; }
    #viewport { position: relative; background: #e2e8ee; border: 1px solid #cbd5df; border-radius: 10px; min-height: 0; min-width: 0; overflow: hidden; }
    #viewport canvas { display: block; width: 100%; height: 100%; min-height: 0; }
    #status { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px); padding: 7px 9px; background: #fff; border: 1px solid #d2dbe5; border-radius: 7px; font-size: 12px; }
    #selection { min-height: 44px; margin-top: 8px; padding: 8px; border-radius: 7px; background: #f2f5f8; color: #34465d; font-size: 12px; overflow-wrap: anywhere; }
    .hint { margin: 5px 0 0; color: #617186; font-size: 12px; }
    @media (max-width: 700px) {
      header { align-items: flex-start; flex-direction: column; gap: 2px; }
      main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(62vh, auto) auto; height: auto; min-height: 0; }
      aside { order: 2; }
      #viewport { order: 1; height: 62vh; min-height: 62vh; }
      #viewport canvas { height: 62vh; min-height: 62vh; }
      #asset-list { max-height: 24vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>머리·목 원본 자산 확인</h1>
    <div class="scope">내부 QA · BodyParts3D R4 · 고정한 85개 source mesh · 정적 reference</div>
  </header>
  <main>
    <aside aria-label="내부 자산 선택">
      <strong>시점</strong>
      <div class="toolbar" aria-label="시점 선택">
        <button type="button" data-view="front" aria-pressed="true">정면</button>
        <button type="button" data-view="back" aria-pressed="false">후면</button>
        <button type="button" data-view="side" aria-pressed="false">측면</button>
      </div>
      <input id="filter" type="search" aria-label="원본 자산 필터" placeholder="FJ ID 또는 원문 영어명">
      <div id="selection" aria-live="polite">구조 자산을 선택하세요. 학습용 canonical ID는 아직 연결되지 않았습니다.</div>
      <p class="hint">키보드: 1 정면 · 2 후면 · 3 측면. 자산 선택은 안정적인 source-mesh key를 사용합니다.</p>
      <div id="asset-list" role="listbox" aria-label="고정 source mesh 목록"></div>
    </aside>
    <section id="viewport" aria-label="하나의 3D scene renderer">
      <div id="status" role="status">원본 mesh 불러오는 중…</div>
    </section>
  </main>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from '/atlas-web/node_modules/three/examples/jsm/loaders/GLTFLoader.js';

    const manifestUrl = '/atlas-data/manifests/bodyparts3d-r4-t52/head-neck.json';
    const statusNode = document.querySelector('#status');
    const viewport = document.querySelector('#viewport');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    viewport.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#e2e8ee');
    const camera = new THREE.PerspectiveCamera(36, 1, 0.001, 100);
    const anatomySceneRoot = new THREE.Group();
    anatomySceneRoot.name = 'AnatomySceneRoot';
    scene.add(anatomySceneRoot);
    scene.add(new THREE.HemisphereLight(0xf3f7ff, 0x7a8390, 2.1));
    const key = new THREE.DirectionalLight(0xfff1dc, 2.2); key.position.set(1.4, 1.8, 2.2); scene.add(key);
    const fill = new THREE.DirectionalLight(0xa6cfff, 1.15); fill.position.set(-1.5, 0.5, -1.3); scene.add(fill);
    const meshes = new Map();
    const baseMaterials = new Map();
    let activeView = 'front';
    let selectedAssetId = null;
    let allAssets = [];
    let rootBounds = new THREE.Box3();
    let loaded = false;
    window.t52QA = { page: 'T52 private source-only QA', meshCount: 0, canvasCount: 0, anatomySceneRootCount: 0, regionCounts: {}, view: activeView, selectedAssetId, loaded: false, errors: [] };

    function resize() {
      const rect = viewport.getBoundingClientRect();
      const width = Math.max(1, rect.width);
      const height = Math.max(1, rect.height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
      render();
    }
    function fitView(view) {
      activeView = view;
      const center = rootBounds.getCenter(new THREE.Vector3());
      const size = rootBounds.getSize(new THREE.Vector3());
      const radius = Math.max(size.length() * 0.5, 0.1);
      // Fit the complete head/neck source bounds in the narrower camera axis.
      // The additional depth allowance keeps the nearest vertices inside the
      // frustum at front/back/side, including on a tall mobile viewport.
      const halfFovV = THREE.MathUtils.degToRad(camera.fov / 2);
      const limitingHalfFov = Math.atan(Math.tan(halfFovV) * Math.min(1, camera.aspect));
      const distance = radius / Math.sin(limitingHalfFov) * 1.12 + radius * 0.35;
      const offsets = {
        front: new THREE.Vector3(0, 0, distance),
        back: new THREE.Vector3(0, 0, -distance),
        side: new THREE.Vector3(-distance, 0, 0),
      };
      camera.position.copy(center).add(offsets[view]);
      camera.up.set(0, 1, 0);
      camera.lookAt(center);
      camera.near = Math.max(radius / 10000, 0.001);
      camera.far = radius * 12;
      camera.updateProjectionMatrix();
      document.querySelectorAll('[data-view]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
      window.t52QA.view = view;
      render();
    }
    function render() {
      renderer.render(scene, camera);
      window.t52QA.canvasCount = document.querySelectorAll('canvas').length;
      window.t52QA.anatomySceneRootCount = scene.children.filter((child) => child.name === 'AnatomySceneRoot').length;
      window.t52QA.rendererIdentity = renderer.domElement.dataset.rendererIdentity ||= 'T52-single-renderer';
      window.t52QA.rootName = anatomySceneRoot.name;
    }
    function selectAsset(asset) {
      if (selectedAssetId && meshes.has(selectedAssetId)) {
        const prior = meshes.get(selectedAssetId);
        prior.material = baseMaterials.get(selectedAssetId);
      }
      selectedAssetId = asset.stableMeshAssetId;
      const mesh = meshes.get(selectedAssetId);
      if (mesh) {
        const base = baseMaterials.get(selectedAssetId);
        const selectedMaterial = base.clone();
        if (selectedMaterial.emissive) selectedMaterial.emissive.set('#9c5b18');
        if (selectedMaterial.color) selectedMaterial.color.lerp(new THREE.Color('#ffd294'), 0.18);
        mesh.material = selectedMaterial;
      }
      window.t52QA.selectedAssetId = selectedAssetId;
      const sideNote = asset.lateralityBoundsDiagnostic?.startsWith('bounds_center_opposes_source_name_human_check_required')
        ? ' · 좌우 대조 필요'
        : asset.lateralityBoundsDiagnostic === 'bounds_cross_midline_direction_inconclusive'
          ? ' · bounds로 좌우 판정 불가'
          : '';
      document.querySelector('#selection').textContent = `${asset.sourceElementFileId} · ${asset.sourceName ?? '이름 확인 대기'} · ${asset.laterality}${sideNote} · source asset 선택 (canonical ID 미연결)`;
      document.querySelectorAll('.asset').forEach((button) => button.setAttribute('aria-selected', String(button.dataset.id === selectedAssetId)));
      render();
    }
    function renderList(assets) {
      const list = document.querySelector('#asset-list');
      list.replaceChildren();
      const filter = document.querySelector('#filter').value.trim().toLowerCase();
      for (const asset of assets) {
        const label = `${asset.sourceElementFileId} ${asset.sourceName ?? ''} ${asset.regionIds.join(' ')}`.toLowerCase();
        if (filter && !label.includes(filter)) continue;
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'asset'; button.setAttribute('role', 'option');
        button.setAttribute('aria-selected', String(asset.stableMeshAssetId === selectedAssetId));
        button.dataset.id = asset.stableMeshAssetId;
        button.textContent = `${asset.sourceElementFileId} · ${asset.sourceName ?? '원문 이름 확인 대기'}`;
        const small = document.createElement('small');
        const sideNote = asset.lateralityBoundsDiagnostic?.startsWith('bounds_center_opposes_source_name_human_check_required')
          ? ' · 좌우 대조 필요'
          : asset.lateralityBoundsDiagnostic === 'bounds_cross_midline_direction_inconclusive'
            ? ' · bounds 좌우 불명'
            : '';
        small.textContent = `${asset.regionIds.join(' / ')} · ${asset.laterality}${sideNote} · ${asset.stableMeshAssetId}`;
        button.append(small);
        button.addEventListener('click', () => selectAsset(asset));
        list.append(button);
      }
    }
    document.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => fitView(button.dataset.view)));
    document.querySelector('#filter').addEventListener('input', () => renderList(allAssets));
    window.addEventListener('keydown', (event) => {
      if (event.target instanceof HTMLInputElement) return;
      if (event.key === '1') fitView('front');
      if (event.key === '2') fitView('back');
      if (event.key === '3') fitView('side');
    });
    window.addEventListener('resize', resize);
    new ResizeObserver(resize).observe(viewport);
    window.addEventListener('error', (event) => window.t52QA.errors.push(String(event.message || event.error || 'window error')));
    window.addEventListener('unhandledrejection', (event) => window.t52QA.errors.push(String(event.reason || 'unhandled rejection')));

    try {
      const response = await fetch(manifestUrl);
      if (!response.ok) throw new Error(`manifest HTTP ${response.status}`);
      const manifest = await response.json();
      allAssets = manifest.sourceAssets;
      const loader = new GLTFLoader();
      for (const batch of manifest.internalBatches) {
        const gltf = await new Promise((resolve, reject) => loader.load(`/${batch.glbPath}`, resolve, undefined, reject));
        for (const child of [...gltf.scene.children]) anatomySceneRoot.add(child);
      }
      anatomySceneRoot.updateMatrixWorld(true);
      rootBounds = new THREE.Box3().setFromObject(anatomySceneRoot);
      anatomySceneRoot.traverse((node) => {
        if (!node.isMesh) return;
        const id = node.userData.stableMeshAssetId || node.name;
        if (meshes.has(id)) throw new Error(`duplicate selectable mesh ID ${id}`);
        meshes.set(id, node);
        baseMaterials.set(id, node.material);
      });
      const regionCounts = Object.fromEntries(Object.entries(manifest.regionPackages).map(([region, item]) => [region, item.sourceMeshCount]));
      window.t52QA = { ...window.t52QA, meshCount: meshes.size, loaded: true, regionCounts, sourceFileIds: [...meshes.values()].map((node) => node.userData.sourceFileId).sort(), stableMeshAssetIds: [...meshes.keys()].sort(), boundsMin: rootBounds.min.toArray(), boundsMax: rootBounds.max.toArray(), vertexBufferCount: meshes.size, canonicalLearnerBindingCount: manifest.scope.canonicalStableLearnerBindings, lateralityBoundsDiagnostics: manifest.lateralityBoundsDiagnostics, view: activeView, selectedAssetId };
      statusNode.textContent = `${meshes.size}개 원본 mesh · head 24 · neck 61 · 단일 root / renderer`;
      renderList(allAssets);
      resize();
      fitView('front');
      loaded = true;
      window.t52QA.loaded = loaded;
    } catch (error) {
      window.t52QA.errors.push(String(error));
      statusNode.textContent = `불러오기 실패: ${String(error)}`;
      console.error(error);
    }
  </script>
</body>
</html>
