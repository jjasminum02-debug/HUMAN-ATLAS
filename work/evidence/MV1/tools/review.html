 }
 const report={capturedAt:new Date().toISOString(),sampling:'every GLB clip keyframe and every adjacent-keyframe midpoint, split across small contact sheets',transform:'each sourceBinding.instanceMatrix applied with DatasetSceneAdapter role semantics',metrics,failures,limitations:{attachmentDrift:'not measured; no authored attachment landmark arrays in candidate contract',penetration:'not measured numerically; no collision oracle. Requires visual learner-runtime inspection',naturalContraction:'not inferred from numeric metrics'}};
 await saveBlob('metrics/automatic-metrics-v3.json',new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));captureLog.playbackSheetsV3=files;captureLog.failuresV3=failures;await saveBlob('runtime/capture-index-v3.json',new Blob([JSON.stringify(captureLog,null,2)],{type:'application/json'}));statusEl.textContent='playback sheets v3 '+metrics.filter(m=>m.technicalStatus==='pass').length+'/'+muscleGroups.length+' groups · '+files.length+' segments · errors '+failures.length;setBusy('sheets',false);

async function captureFocusedPhaseSheets(){
 const btn=$('phases');setBusy('phases',true);const files=[],failures=[],labels=['rest','preparation 25%','intermediate 50%','maximum 100%','return 50%'];
 for(let ix=0;ix<muscleGroups.length;ix++){

   await loadMotion(row);const d=current.duration,reverse=row.poseControl?.actionDirection==='reverse';

   const cellW=320,cellH=220,header=54,canvas=document.createElement('canvas');canvas.width=cellW*3;canvas.height=header+cellH*labels.length;const ctx=canvas.getContext('2d');ctx.fillStyle='#10161b';ctx.fillRect(0,0,canvas.width,canvas.height);
   ctx.fillStyle='#fff';ctx.font='13px system-ui';ctx.fillText(`${ix+1}/${muscleGroups.length} ${row.selectedRowEnglishName||row.sourceKey} · ${row.sourceKey} · ${row.sourceKeySide||''} · ${row.selectedMemberRole||''}`,5,17);ctx.fillStyle='#9cb0b6';ctx.font='10px system-ui';ctx.fillText(`${row.clipId} · ${row.sha256} · ${row.uri}`,5,35);
   for(let v=0;v<3;v++){ctx.fillStyle='#d5e2e5';ctx.font='10px system-ui';ctx.fillText(cameraDefs[v].label,cellW*v+6,50);}

    for(let v=0;v<3;v++){renderer.setSize(cellW,cellH-20,false);renderer.setViewport(0,0,cellW,cellH-20);renderer.setScissor(0,0,cellW,cellH-20);renderer.render(current.scene,cameras[v]);ctx.drawImage(renderer.domElement,0,0,cellW,cellH-20,v*cellW,y+20,cellW,cellH-20);}
   }
   const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.9));const path=`visual/focused-phase-sheets/${String(ix+1).padStart(2,'0')}-${group.dedupeKey.slice(0,12)}.jpg`;files.push({targetId:row.targetId,sourceKey:row.sourceKey,side:row.sourceKeySide,role:row.selectedMemberRole,uri:row.uri,sha256:row.sha256,clipId:row.clipId,durationSeconds:d,actionDirection:reverse?'reverse':'forward',phases:labels.map((label,i)=>({label,timeSeconds:times[i]})),path:(await saveBlob(path,blob)).path});

  if((ix+1)%2===0){statusEl.textContent=`focused-phase visual review sheets ${ix+1}/${muscleGroups.length}; errors ${failures.length}`;await new Promise(resolve=>setTimeout(resolve,0));}
 }
 const report={capturedAt:new Date().toISOString(),groups:files.length,failures,viewOrder:cameraDefs.map(x=>x.label),phaseSemantics:'static pose samples at documented clip times; full continuous ping-pong recorded separately',limits:'selected-subject emphasis uses the review harness teal highlight, not the learner UI action/return color animation'};
 await saveBlob('runtime/focused-phase-index.json',new Blob([JSON.stringify({report,files},null,2)],{type:'application/json'}));statusEl.textContent=`focused-phase sheets ${files.length}/${muscleGroups.length}; errors ${failures.length}`;setBusy('phases',false);
}

async function recordFullCycle(){
 const btn=$('video');setBusy('video',true);const out=$('movie'),ctx=out.getContext('2d'),fps=12,clipW=320,clipH=260;out.width=clipW*3;out.height=clipH+40;
 const stream=out.captureStream(fps),mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1800000});const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};const done=new Promise((resolve,reject)=>{recorder.onstop=()=>resolve(new Blob(chunks,{type:'video/webm'}));recorder.onerror=e=>reject(e.error||Error('MediaRecorder error'));});recorder.start(1000);
 const frameMs=1000/fps;const drawFrame=(title,t,tracker)=>{seek(t);if(tracker){let maxStep=0,sum=0;const pos=tracker.mesh.geometry.getAttribute('position'),p=new THREE.Vector3();for(let i=0;i<pos.count;i++){tracker.mesh.getVertexPosition(i,p);const step=p.distanceTo(tracker.previous[i]);maxStep=Math.max(maxStep,step);sum+=step;if(t<=1e-8)tracker.returnResidual=Math.max(tracker.returnResidual,p.distanceTo(tracker.rest[i]));tracker.previous[i].copy(p);}tracker.maxVertexStep=Math.max(tracker.maxVertexStep,maxStep);tracker.meanVertexStepSum+=sum/pos.count;tracker.frameCount++;}renderer.setSize(clipW,clipH,false);ctx.fillStyle='#0d1217';ctx.fillRect(0,0,out.width,out.height);ctx.fillStyle='#f2f8f8';ctx.font='14px system-ui';ctx.fillText(title,10,18);ctx.fillStyle='#a6b7bc';ctx.font='11px system-ui';for(let v=0;v<3;v++){renderer.setViewport(0,0,clipW,clipH);renderer.setScissor(0,0,clipW,clipH);renderer.render(current.scene,cameras[v]);ctx.drawImage(renderer.domElement,0,0,clipW,clipH,v*clipW,30,clipW,clipH-30);ctx.fillStyle='#d5e2e5';ctx.fillText(cameraDefs[v].label,v*clipW+6,out.height-8);}};
 for(let ix=0;ix<muscleGroups.length;ix++){const group=muscleGroups[ix],row=chooseSample(group);try{await loadMotion(row);const d=current.duration,reverse=row.poseControl?.actionDirection==='reverse',returnSpeed=reverse?1:1.7;const target=row.sourceBinding.members.find(m=>m.sourceKey===row.sourceBinding.subjectSourceKey),mesh=current.byName.get(target.nodeId),pattr=mesh.geometry.getAttribute('position'),v=new THREE.Vector3(),rest=[],previous=[];seek(0);for(let i=0;i<pattr.count;i++){mesh.getVertexPosition(i,v);rest.push(v.clone());previous.push(v.clone());}const tracker={mesh,rest,previous,maxVertexStep:0,meanVertexStepSum:0,frameCount:0,returnResidual:0};const total=d+d/returnSpeed,n=Math.max(2,Math.ceil(total*fps));for(let frame=0;frame<=n;frame++){const elapsed=frame/fps;const t=elapsed<=d?elapsed:Math.max(0,d-(elapsed-d)*returnSpeed);const phase=elapsed<=d?(reverse?'preparation':'action'):(reverse?'action':'return');drawFrame(`${ix+1}/${muscleGroups.length} ${row.selectedRowEnglishName} · ${row.sourceKeySide||''} · ${row.clipId} · ${phase}`,t,tracker);await new Promise(r=>setTimeout(r,frameMs));}
 captureLog.videos.push({dedupeKey:group.dedupeKey,representativeTargetId:row.targetId,sourceKey:row.sourceKey,side:row.sourceKeySide,role:row.selectedMemberRole,uri:row.uri,sha256:row.sha256,clipId:row.clipId,durationSeconds:d,playbackSeconds:total,actionDirection:reverse?'reverse':'forward',frameCount:n+1,framesPerSecond:fps,maxSubjectVertexStepPerFrameMetres:tracker.maxVertexStep,meanSubjectVertexStepPerFrameMetres:tracker.frameCount?tracker.meanVertexStepSum/tracker.frameCount:0,returnResidualMaxMetres:tracker.returnResidual});
 if((ix+1)%3===0){statusEl.textContent=`whole-cycle playback recording ${ix+1}/${muscleGroups.length}: ${row.clipId}`;await new Promise(r=>setTimeout(r,0));}
 }catch(e){captureLog.failures.push({type:'video',dedupeKey:group.dedupeKey,error:String(e)});}}
 recorder.stop();const blob=await done;const saved=await saveBlob('visual/full-playback/muscle-playback-cycle-v3.webm',blob);captureLog.videoFile=saved;captureLog.finishedAt=new Date().toISOString();await saveBlob('runtime/capture-index-v3.json',new Blob([JSON.stringify(captureLog,null,2)],{type:'application/json'}));statusEl.textContent=`full-cycle video v3 saved (${captureLog.videos.length}/${muscleGroups.length} muscle groups, ${Math.round(blob.size/1e6)} MB) · failures ${captureLog.failures.length}`;setBusy('video',false);
}
